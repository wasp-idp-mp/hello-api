apiVersion: score.dev/v1b1

metadata:
  name: hello-api

resources:
  db:
    type: postgres
  dns:
    type: dns
  route:
    type: route
    params:
      host: ${resources.dns.host}
      path: /
      port: 80

containers:
  api:
    image: .
    variables:
      APP_NAME: hello-api
      APP_TITLE: "hello-api"
      APP_THEME: indigo
      APP_DESCRIPTION: ""
      DATABASE_HOST: ${resources.db.host}
      DATABASE_PORT: ${resources.db.port}
      DATABASE_NAME: ${resources.db.name}
      DATABASE_USER: ${resources.db.username}
      DATABASE_PASSWORD: ${resources.db.password}
      # true shows the host, user and the driver's errors on the home page and in /api/db: demos only.
      SHOW_DATABASE_DETAILS: "false"
    # The denominator of saturation in platform workload signals (ADR 0040).
    resources:
      limits:
        cpu: 500m
        memory: 256Mi

service:
  ports:
    http:
      port: 80
      targetPort: 8000
